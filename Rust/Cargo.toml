[package]
name = "jxl-coder"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause OR Apache-2.0"
publish = false

[lib]
name = "jxl_coder"
crate-type = ["rlib", "staticlib"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["nightly_float"] }
gainforge = "0.5.1"
jixel = { version = "^0.5.13", default-features = false, features = ["sse", "avx", "neon"] }
jxl = { git = "https://github.com/libjxl/jxl-rs.git", rev = "f370be423933628eb7f783f1b61d4c765eca5f79", default-features = false, features = ["brotli"] }
moxcms = { version = "0.9.2", default-features = false, features = ["extended_range"] }
pic-scale = { version = "0.7.14", default-features = false, features = ["nightly_f16"] }

[profile.release]
codegen-units = 1
lto = "thin"
